<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <title>반품 상품 스캔</title>


  <!-- ==========================================
       html5-qrcode
  =========================================== -->

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    /* =====================================================
       기본
    ===================================================== */

    :root {

      --bg: #101317;

      --panel: #171b21;

      --panel-border: #303640;

      --white: #ffffff;

      --gray: #aeb6c2;

      --green: #34d399;

      --red: #ff6b6b;

    }


    * {

      box-sizing:
        border-box;

      -webkit-tap-highlight-color:
        transparent;

    }


    html,
    body {

      width:
        100%;

      height:
        100%;

      min-height:
        100%;

      margin:
        0;

      padding:
        0;

      background:
        var(--bg);

      color:
        var(--white);

      font-family:

        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        "Malgun Gothic",
        Arial,
        sans-serif;

      -webkit-text-size-adjust:
        100%;

    }


    body {

      min-height:
        100dvh;

      overflow:
        hidden;

    }


    button,
    input {

      font:
        inherit;

    }



    /* =====================================================
       전체 앱
    ===================================================== */

    .app {

      width:
        100%;

      height:
        100dvh;

      min-height:
        100dvh;

      display:
        flex;

      flex-direction:
        column;

      padding:

        max(
          14px,
          env(
            safe-area-inset-top
          )
        )

        12px

        max(
          12px,
          env(
            safe-area-inset-bottom
          )
        );

    }



    /* =====================================================
       헤더
    ===================================================== */

    .header {

      flex:
        0
        0
        auto;

      padding:
        3px
        2px
        12px;

    }


    .title {

      margin:
        0;

      font-size:
        clamp(
          29px,
          8vw,
          38px
        );

      line-height:
        1.1;

      font-weight:
        950;

      letter-spacing:
        -1.4px;

    }


    .subtitle {

      margin-top:
        6px;

      color:
        var(--gray);

      font-size:
        clamp(
          14px,
          4vw,
          18px
        );

      font-weight:
        700;

    }



    /* =====================================================
       메인 카메라 패널
    ===================================================== */

    .camera-panel {

      flex:
        1
        1
        auto;

      min-height:
        0;

      display:
        flex;

      flex-direction:
        column;

      padding:
        10px;

      background:
        var(--panel);

      border:
        1px
        solid
        var(--panel-border);

      border-radius:
        20px;

      overflow:
        hidden;

    }


    .camera-header {

      flex:
        0
        0
        auto;

      margin-bottom:
        8px;

      font-size:
        18px;

      font-weight:
        900;

    }



    /* =====================================================
       카메라 표시 영역
    ===================================================== */

    .camera-container {

      flex:
        1
        1
        auto;

      min-height:
        0;

      position:
        relative;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      overflow:
        hidden;

      border-radius:
        16px;

      background:
        #050608;

    }


    #reader {

      width:
        100%;

      height:
        100%;

      min-height:
        0;

    }


    /*
     * html5-qrcode가 넣는
     * 실제 카메라 영상
     */

    #reader video {

      width:
        100% !important;

      height:
        100% !important;

      object-fit:
        cover !important;

    }


    /*
     * 라이브러리 내부 scan region
     */

    #reader__scan_region {

      width:
        100% !important;

      height:
        100% !important;

    }



    /* =====================================================
       중앙 바코드 가이드
    ===================================================== */

    .guide {

      position:
        absolute;

      left:
        50%;

      top:
        50%;

      width:
        88%;

      height:
        28%;

      transform:
        translate(
          -50%,
          -50%
        );

      border:
        3px
        solid
        rgba(
          255,
          255,
          255,
          0.92
        );

      border-radius:
        16px;

      pointer-events:
        none;

    }


    .guide-line {

      position:
        absolute;

      left:
        10px;

      right:
        10px;

      top:
        50%;

      height:
        2px;

      background:
        rgba(
          255,
          255,
          255,
          0.8
        );

    }


    .guide-text {

      position:
        absolute;

      left:
        50%;

      bottom:
        -48px;

      transform:
        translateX(
          -50%
        );

      width:
        max-content;

      max-width:
        90%;

      padding:
        8px
        12px;

      border-radius:
        9px;

      background:
        rgba(
          0,
          0,
          0,
          0.7
        );

      color:
        #fff;

      font-size:
        12px;

      font-weight:
        800;

      white-space:
        nowrap;

      text-align:
        center;

    }



    /* =====================================================
       상태
    ===================================================== */

    .status {

      flex:
        0
        0
        auto;

      min-height:
        48px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      padding:
        8px
        5px
        2px;

      color:
        var(--gray);

      font-size:
        14px;

      line-height:
        1.5;

      font-weight:
        750;

      text-align:
        center;

    }


    .status.success {

      color:
        var(--green);

    }


    .status.error {

      color:
        var(--red);

    }



    /* =====================================================
       카메라 시작 버튼
    ===================================================== */

    .camera-start-button {

      flex:
        0
        0
        auto;

      width:
        100%;

      min-height:
        64px;

      border:
        0;

      border-radius:
        13px;

      background:
        #ffffff;

      color:
        #111827;

      font-size:
        20px;

      font-weight:
        950;

      cursor:
        pointer;

    }



    /* =====================================================
       직접 입력
    ===================================================== */

    .manual-panel {

      flex:
        0
        0
        auto;

      margin-top:
        9px;

      padding:
        10px;

      background:
        var(--panel);

      border:
        1px
        solid
        var(--panel-border);

      border-radius:
        15px;

    }


    .manual-title {

      margin-bottom:
        6px;

      font-size:
        13px;

      font-weight:
        800;

    }


    .manual-row {

      display:
        flex;

      gap:
        7px;

    }


    .manual-input {

      flex:
        1
        1
        auto;

      min-width:
        0;

      height:
        50px;

      padding:
        0
        12px;

      border:
        1px
        solid
        #3b4350;

      border-radius:
        10px;

      background:
        #0d1014;

      color:
        white;

      outline:
        none;

      font-size:
        17px;

      font-weight:
        700;

    }


    .manual-input::placeholder {

      color:
        #737d89;

    }


    .manual-button {

      flex:
        0
        0
        70px;

      height:
        50px;

      border:
        0;

      border-radius:
        10px;

      background:
        #ffffff;

      color:
        #111827;

      font-size:
        14px;

      font-weight:
        900;

      cursor:
        pointer;

    }



    /* =====================================================
       오류박스
    ===================================================== */

    .error-box {

      width:
        100%;

      margin-top:
        8px;

      padding:
        12px;

      border-radius:
        11px;

      background:
        rgba(
          255,
          107,
          107,
          0.12
        );

      color:
        var(--red);

      font-size:
        12px;

      line-height:
        1.55;

      text-align:
        left;

    }



    /* =====================================================
       짧은 화면
    ===================================================== */

    @media (
      max-height: 700px
    ) {

      .app {

        padding:
          8px
          9px
          8px;

      }


      .header {

        padding-bottom:
          7px;

      }


      .title {

        font-size:
          25px;

      }


      .subtitle {

        font-size:
          12px;

      }


      .camera-panel {

        padding:
          8px;

      }


      .camera-header {

        font-size:
          15px;

        margin-bottom:
          5px;

      }


      .status {

        min-height:
          36px;

        font-size:
          12px;

      }


      .manual-panel {

        margin-top:
          6px;

        padding:
          7px;

      }


      .manual-title {

        font-size:
          11px;

      }


      .manual-input,
      .manual-button {

        height:
          43px;

      }


      .camera-start-button {

        min-height:
          52px;

        font-size:
          17px;

      }

    }

  </style>

</head>



<body>


<div class="app">


  <!-- ===================================================
       HEADER
  ==================================================== -->

  <header class="header">

    <h1 class="title">

      반품 상품 스캔

    </h1>


    <div class="subtitle">

      바코드를 화면 중앙에 맞춰주세요

    </div>

  </header>



  <!-- ===================================================
       CAMERA
  ==================================================== -->

  <section class="camera-panel">


    <div class="camera-header">

      📷 카메라 스캐너

    </div>


    <div class="camera-container">


      <!--
        html5-qrcode가
        카메라 영상을 표시합니다.
      -->

      <div id="reader"></div>


      <!--
        중앙 가이드
      -->

      <div class="guide">

        <div class="guide-line"></div>


        <div class="guide-text">

          바코드를 이 영역에 맞춰주세요

        </div>

      </div>

    </div>


    <!-- =================================================
         상태
    ================================================== -->

    <div
      id="status"
      class="status"
    >

      아래 버튼을 눌러 카메라를 시작하세요.

    </div>


    <!-- =================================================
         카메라 시작 버튼

         처음부터 자동 실행하지 않고
         사용자가 직접 시작합니다.
    ================================================== -->

    <button
      id="cameraStartButton"
      class="camera-start-button"
      type="button"
      onclick="startCamera()"
    >

      📷 카메라 시작

    </button>


  </section>



  <!-- ===================================================
       직접 입력
  ==================================================== -->

  <section class="manual-panel">


    <div class="manual-title">

      바코드 직접 입력

    </div>


    <div class="manual-row">


      <input
        id="manualBarcode"
        class="manual-input"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="바코드 번호"
      >


      <button
        class="manual-button"
        type="button"
        onclick="openProductPage()"
      >

        조회

      </button>


    </div>


  </section>


</div>



<script>


  /* =====================================================
     Google Apps Script 주소
  ===================================================== */

  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzv1lpGYxJvBGeMB3P43O3fhFq4dGVQ5CpdIF37-9_xRTZrtn6vIKg1hg6eydv9YTVb/exec";



  /* =====================================================
     상태 변수
  ===================================================== */

  let scanner = null;

  let cameraStarted = false;

  let barcodeDetected = false;



  /* =====================================================
     DOM
  ===================================================== */

  const statusElement =
    document.getElementById(
      "status"
    );


  const startButton =
    document.getElementById(
      "cameraStartButton"
    );


  const manualInput =
    document.getElementById(
      "manualBarcode"
    );



  /* =====================================================
     상태 표시 함수
  ===================================================== */

  function setStatus(
    message,
    type = ""
  ) {


    statusElement.textContent =
      message;


    statusElement.className =
      "status";


    if (type) {

      statusElement.classList.add(
        type
      );

    }

  }



  /* =====================================================
     상품 조회 페이지 이동
  ===================================================== */

  function openProductPage(
    barcode = ""
  ) {


    /*
     * 카메라에서 넘어온 값이 없으면
     * 직접 입력값 사용
     */

    let value =
      barcode ||
      manualInput.value.trim();


    /*
     * 숫자만 남김
     */

    value =
      String(
        value
      ).replace(
        /\D/g,
        ""
      );


    /*
     * 빈 값
     */

    if (!value) {

      setStatus(
        "바코드 번호를 입력해주세요.",
        "error"
      );

      return;

    }


    /*
     * 카메라 중지
     */

    stopCamera();


    /*
     * Apps Script URL 생성
     */

    const target =
      new URL(
        APPS_SCRIPT_URL
      );


    /*
     * barcode 파라미터 추가
     */

    target.searchParams.set(
      "barcode",
      value
    );


    /*
     * 상품 조회 페이지 이동
     */

    window.location.href =
      target.toString();

  }



  /* =====================================================
     카메라 시작
  ===================================================== */

  async function startCamera() {


    /*
     * 이미 켜져 있으면
     * 다시 실행하지 않습니다.
     */

    if (cameraStarted) {

      return;

    }


    try {


      barcodeDetected =
        false;


      startButton.disabled =
        true;


      startButton.style.display =
        "none";


      setStatus(
        "카메라를 준비하는 중입니다..."
      );


      /*
       * 새로운 scanner
       */

      scanner =
        new Html5Qrcode(
          "reader"
        );


      /*
       * 사용할 바코드 종류
       */

      const formats = [

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8,

        Html5QrcodeSupportedFormats.UPC_A,

        Html5QrcodeSupportedFormats.UPC_E,

        Html5QrcodeSupportedFormats.CODE_128,

        Html5QrcodeSupportedFormats.ITF

      ];


      /*
       * 스캔 설정
       */

      const config = {

        fps:
          10,

        qrbox: {

          width:
            300,

          height:
            140

        },

        formatsToSupport:
          formats

      };


      /*
       * 먼저 후면 카메라를
       * environment 방식으로 요청
       */

      try {


        await scanner.start(

          {
            facingMode:
              "environment"
          },

          config,

          onScanSuccess,

          onScanFailure

        );


      }

      catch (
        firstCameraError
      ) {


        console.log(
          "후면 카메라 직접 접근 실패:",
          firstCameraError
        );


        /*
         * 후면 카메라 직접 접근이 실패하면
         * 사용 가능한 카메라 목록을 가져옵니다.
         */

        setStatus(
          "사용 가능한 카메라를 찾는 중입니다..."
        );


        const cameras =
          await Html5Qrcode.getCameras();


        if (
          !cameras ||
          cameras.length === 0
        ) {

          throw new Error(
            "사용 가능한 카메라를 찾지 못했습니다."
          );

        }


        /*
         * 카메라 이름에
         * back / rear / environment / 후면 등이 들어 있으면
         * 우선 사용합니다.
         */

        let selectedCamera =
          cameras.find(
            function(camera) {

              const label =
                String(
                  camera.label || ""
                ).toLowerCase();


              return (

                label.includes(
                  "back"
                ) ||

                label.includes(
                  "rear"
                ) ||

                label.includes(
                  "environment"
                ) ||

                label.includes(
                  "후면"
                )

              );

            }
          );


        /*
         * 못 찾으면 첫 번째 카메라
         */

        if (!selectedCamera) {

          selectedCamera =
            cameras[0];

        }


        /*
         * 선택한 camera ID로
         * 다시 시작합니다.
         */

        await scanner.start(

          selectedCamera.id,

          config,

          onScanSuccess,

          onScanFailure

        );

      }


      /*
       * 성공적으로 시작됨
       */

      cameraStarted =
        true;


      setStatus(
        "카메라가 켜졌습니다. 바코드를 중앙에 맞춰주세요."
      );


    }

    catch (error) {


      console.error(
        "카메라 시작 실패:",
        error
      );


      cameraStarted =
        false;


      startButton.disabled =
        false;


      startButton.style.display =
        "block";


      /*
       * 사용자에게
       * 가능한 원인을 표시
       */

      setStatus(
        "카메라를 시작하지 못했습니다.",
        "error"
      );


      const existingError =
        document.getElementById(
          "cameraError"
        );


      if (existingError) {

        existingError.remove();

      }


      const errorBox =
        document.createElement(
          "div"
        );


      errorBox.id =
        "cameraError";


      errorBox.className =
        "error-box";


      errorBox.innerHTML =

        "다음 사항을 확인해주세요." +

        "<br><br>" +

        "① 브라우저의 카메라 권한을 허용했는지 확인<br>" +

        "② 주소가 https://로 시작하는지 확인<br>" +

        "③ 다른 앱이 카메라를 사용하고 있지 않은지 확인<br>" +

        "④ Safari 또는 Chrome에서 다시 접속해보기";


      startButton.parentNode.insertBefore(

        errorBox,

        startButton.nextSibling

      );

    }

  }



  /* =====================================================
     바코드 인식 성공
  ===================================================== */

  function onScanSuccess(
    decodedText,
    decodedResult
  ) {


    /*
     * 동일 바코드가 여러 프레임에서
     * 반복 인식되는 것을 막습니다.
     */

    if (barcodeDetected) {

      return;

    }


    barcodeDetected =
      true;


    /*
     * 숫자만 추출
     */

    const barcode =
      String(
        decodedText
      ).replace(
        /\D/g,
        ""
      );


    /*
     * 숫자가 없다면 다시 스캔
     */

    if (!barcode) {

      barcodeDetected =
        false;

      return;

    }


    /*
     * 성공 표시
     */

    setStatus(
      "✓ 바코드 인식 완료 · " +
      barcode +
      " · 상품을 조회합니다.",
      "success"
    );


    /*
     * 0.5초 후
     * Apps Script로 이동
     */

    setTimeout(

      function() {

        openProductPage(
          barcode
        );

      },

      500

    );

  }



  /* =====================================================
     바코드 인식 실패

     정상적인 스캔 과정에서는
     계속 발생하므로 아무것도 하지 않습니다.
  ===================================================== */

  function onScanFailure(
    errorMessage
  ) {

    /*
     * 무시
     */

  }



  /* =====================================================
     카메라 중지
  ===================================================== */

  async function stopCamera() {


    if (!scanner) {

      return;

    }


    try {

      await scanner.stop();

    }

    catch (error) {

      console.log(
        "카메라 종료:",
        error
      );

    }


    cameraStarted =
      false;

  }



  /* =====================================================
     직접 입력 Enter
  ===================================================== */

  manualInput.addEventListener(

    "keydown",

    function(event) {

      if (
        event.key === "Enter"
      ) {

        openProductPage();

      }

    }

  );


</script>


</body>
</html>
