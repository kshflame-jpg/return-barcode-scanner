<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>반품 상품 바코드 스캐너</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #f3f4f6;
      font-family: Arial, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 700px;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .title {
      font-size: 32px;
      font-weight: 800;
      text-align: center;
      margin: 10px 0 8px;
      color: #111827;
    }

    .subtitle {
      text-align: center;
      font-size: 16px;
      color: #6b7280;
      margin-bottom: 20px;
    }

    .camera-box {
      background: white;
      border-radius: 20px;
      padding: 15px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      margin-bottom: 18px;
    }

    #reader {
      width: 100%;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
      max-height: 460px;
      object-fit: cover;
      border-radius: 14px;
    }

    #reader__scan_region {
      width: 100% !important;
      min-height: 260px !important;
    }

    #reader__dashboard {
      width: 100% !important;
    }

    #reader__dashboard_section {
      width: 100% !important;
    }

    #reader button {
      font-size: 18px !important;
      font-weight: 700 !important;
      padding: 14px 18px !important;
      border-radius: 12px !important;
      margin-top: 8px !important;
      cursor: pointer;
    }

    #reader select {
      width: 100% !important;
      font-size: 17px !important;
      padding: 13px !important;
      border-radius: 12px !important;
      margin-top: 8px !important;
    }

    .status {
      background: white;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      color: #374151;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
      margin-bottom: 18px;
    }

    .manual-box {
      background: white;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    .manual-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 12px;
      color: #111827;
    }

    .manual-input {
      width: 100%;
      height: 58px;
      border: 2px solid #d1d5db;
      border-radius: 14px;
      padding: 0 16px;
      font-size: 20px;
      outline: none;
    }

    .manual-input:focus {
      border-color: #111827;
    }

    .manual-button {
      width: 100%;
      height: 58px;
      margin-top: 10px;
      border: none;
      border-radius: 14px;
      background: #111827;
      color: white;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
    }

    .manual-button:active {
      transform: scale(0.99);
    }

    .help {
      margin-top: 16px;
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="title">
      📦 반품 상품 스캐너
    </div>

    <div class="subtitle">
      바코드를 카메라 가운데에 맞춰주세요
    </div>

    <div class="camera-box">
      <div id="reader"></div>
    </div>

    <div class="status" id="status">
      카메라 준비 중...
    </div>

    <div class="manual-box">

      <div class="manual-title">
        바코드 직접 입력
      </div>

      <input
        id="manualBarcode"
        class="manual-input"
        type="tel"
        inputmode="numeric"
        placeholder="바코드 번호 입력"
      />

      <button
        class="manual-button"
        onclick="manualSearch()">
        상품 조회
      </button>

      <div class="help">
        카메라를 사용할 수 없는 경우<br>
        바코드 번호를 직접 입력할 수 있습니다.
      </div>

    </div>

  </div>


  <script>

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzv1lpGYxJvBGeMB3P43O3fhFq4dGVQ5CpdIF37-9_xRTZrtn6vIKg1hg6eydv9YTVb/exec";


    let alreadyScanned = false;


    function setStatus(message) {
      document.getElementById("status").innerText = message;
    }


    function goToProduct(barcode) {

      if (alreadyScanned) {
        return;
      }

      alreadyScanned = true;

      const cleanBarcode =
        String(barcode).replace(/\D/g, "");

      if (!cleanBarcode) {
        alreadyScanned = false;
        setStatus("바코드를 다시 인식해주세요.");
        return;
      }

      setStatus(
        "✅ 바코드 인식 완료\n상품 정보를 불러오는 중..."
      );

      setTimeout(function() {

        const url =
          APPS_SCRIPT_URL +
          "?barcode=" +
          encodeURIComponent(cleanBarcode);

        window.location.href = url;

      }, 700);
    }


    function onScanSuccess(decodedText, decodedResult) {

      console.log(
        "바코드 인식:",
        decodedText,
        decodedResult
      );

      goToProduct(decodedText);
    }


    function onScanFailure(errorMessage) {

      // 바코드가 아직 발견되지 않은 것은 정상입니다.
      // 계속해서 카메라 화면을 스캔합니다.
    }


    function startScanner() {

      try {

        const config = {

          fps: 10,

          qrbox: {
            width: 300,
            height: 140
          },

          rememberLastUsedCamera: true,

          supportedScanTypes: [
            Html5QrcodeScanType.SCAN_TYPE_CAMERA
          ],

          formatsToSupport: [
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.UPC_A,
            Html5QrcodeSupportedFormats.UPC_E,
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.ITF
          ],

          showTorchButtonIfSupported: true
        };


        const scanner =
          new Html5QrcodeScanner(
            "reader",
            config,
            false
          );


        scanner.render(

          function(decodedText, decodedResult) {

            onScanSuccess(
              decodedText,
              decodedResult
            );

          },

          function(errorMessage) {

            onScanFailure(errorMessage);

          }

        );


        setStatus(
          "📷 카메라 권한을 허용한 후\n바코드를 화면 중앙에 맞춰주세요."
        );

      }

      catch (error) {

        console.error(error);

        setStatus(
          "❌ 카메라를 불러오지 못했습니다.\n" +
          "브라우저의 카메라 권한을 확인해주세요."
        );

      }

    }


    function manualSearch() {

      const input =
        document.getElementById("manualBarcode");

      const barcode =
        input.value.replace(/\D/g, "");

      if (!barcode) {

        alert("바코드 번호를 입력해주세요.");

        input.focus();

        return;
      }

      goToProduct(barcode);
    }


    document
      .getElementById("manualBarcode")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

          manualSearch();

        }

      });


    window.addEventListener("load", function() {

      startScanner();

    });

  </script>

</body>
</html>
